[project]
name = "hsec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "smbus2",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-xdist>=3.0",
]
dev = [
    "ruff",
]
hardware = [
    "gpiozero>=2.0",
    "lgpio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hardware"]

[tool.ruff]
line-length = 88

[tool.uv.sources]
# This section is intentionally left empty to use the default PyPI source

[project.scripts]
hsec-status = "hardware.cli_status:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = [
    "hardware: marks tests requiring real hardware (HIL)",
    "manual: marks tests requiring human interaction (manual HIL)",
]
norecursedirs = [
    "tests/hardware-in-loop",
]
